name: Lint and test

# Pull requests are covered by the pull_request trigger; scoping push to main
# keeps a PR branch from running the same commit twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The project pins 3.12 (.python-version / requires-python) and uses
      # syntax that older interpreters cannot parse.
      - name: Set up Python
        run: uv python install 3.12

      # Dependencies have to be present or pylint reports import-error for
      # every third-party module and the run says nothing about the code.
      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run pylint $(git ls-files '*.py')

      - name: Test
        run: uv run pytest -q
